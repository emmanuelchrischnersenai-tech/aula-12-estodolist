
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EsToDoList</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-indigo-600 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl md:text-3xl font-bold">EsToDoList</h1>
      <span class="hidden sm:block text-sm">Organize sua rotina escolar</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 gap-6 lg:grid-cols-[400px_minmax(0,1fr)]">

    <!-- Formulário, pesquisa e filtros -->
    <section class="bg-white rounded-xl shadow p-5 space-y-5 lg:sticky lg:top-6 lg:self-start">

      <h2 class="text-lg font-semibold">Minhas tarefas</h2>

      <form class="flex flex-col gap-3">
        <input
          type="text"
          placeholder="Nova tarefa"
          class="w-full border rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >

        <input
          type="date"
          class="w-full border rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >

        <button
          type="submit"
          class="w-full bg-indigo-600 text-white rounded-lg px-4 py-3 font-semibold transition-colors hover:bg-indigo-500"
        >
          Adicionar
        </button>
      </form>

      <input
        type="search"
        placeholder="Pesquisar tarefa..."
        class="w-full border rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >

      <div class="flex flex-wrap gap-2">
        <button class="px-4 py-2 rounded-full bg-indigo-600 text-white whitespace-nowrap">
          Todas
        </button>

        <button class="px-4 py-2 rounded-full bg-slate-200 hover:bg-slate-300 whitespace-nowrap">
          Pendentes
        </button>

        <button class="px-4 py-2 rounded-full bg-slate-200 hover:bg-slate-300 whitespace-nowrap">
          Concluídas
        </button>
      </div>

    </section>

    <!-- Lista de tarefas -->
    <section class="min-w-0">

      <h2 class="text-xl font-bold mb-4">Lista de tarefas</h2>

      <ul class="space-y-3">

        <li class="bg-white rounded-xl shadow p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <label class="flex items-start gap-3 min-w-0">
            <input type="checkbox" class="mt-1 w-5 h-5 shrink-0">
            <span>
              <span class="block font-medium">Trabalho de História</span>
              <span class="text-sm text-slate-500">20/10/2026</span>
            </span>
          </label>

          <div class="flex gap-2 sm:shrink-0">
            <button type="button" aria-label="Editar tarefa" class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-amber-100 hover:bg-amber-200">
              ✏️
            </button>
            <button type="button" aria-label="Excluir tarefa" class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-red-100 text-red-700 hover:bg-red-200">
              🗑️
            </button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <label class="flex items-start gap-3 min-w-0">
            <input type="checkbox" class="mt-1 w-5 h-5 shrink-0">
            <span>
              <span class="block font-medium">Estudar para a prova de Matemática</span>
              <span class="text-sm text-slate-500">22/10/2026</span>
            </span>
          </label>

          <div class="flex gap-2 sm:shrink-0">
            <button type="button" aria-label="Editar tarefa" class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-amber-100 hover:bg-amber-200">
              ✏️
            </button>
            <button type="button" aria-label="Excluir tarefa" class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-red-100 text-red-700 hover:bg-red-200">
              🗑️
            </button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <label class="flex items-start gap-3 min-w-0">
            <input type="checkbox" checked class="mt-1 w-5 h-5 shrink-0">
            <span>
              <span class="block font-medium line-through text-zinc-400">Entregar projeto no GitHub</span>
              <span class="text-sm text-slate-500">08/10/2026</span>
            </span>
          </label>

          <div class="flex gap-2 sm:shrink-0">
            <button type="button" aria-label="Editar tarefa" class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-amber-100 hover:bg-amber-200">
              ✏️
            </button>
            <button type="button" aria-label="Excluir tarefa" class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-red-100 text-red-700 hover:bg-red-200">
              🗑️
            </button>
          </div>
        </li>

      </ul>

      <p class="mt-4 text-sm text-slate-500">2 tarefas pendentes</p>

    </section>

  </main>

</body>
</html>
